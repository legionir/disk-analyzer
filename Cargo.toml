[package]
name = "disk-analyzer"
version = "0.2.0"
edition = "2021"
description = "Parallel Windows disk analyzer with native NTFS MFT support"
license = "MIT"

[[bin]]
name = "disk-analyzer"
path = "src/main.rs"

[dependencies]
ignore = "0.4.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "disk-analyzer"
version = "0.1.0"
edition = "2021"
description = "Fast parallel disk usage analyzer for Windows"
license = "MIT"

[[bin]]
name = "disk-analyzer"
path = "src/main.rs"

[dependencies]
ignore = "0.4.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

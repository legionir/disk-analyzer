name: Build Windows executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add Windows MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Format sources
        run: cargo fmt --all

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Build executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/disk-analyzer.exe" "dist/disk-analyzer.exe"
          Copy-Item "README.md" "dist/README.md"
          Compress-Archive -Path "dist/*" -DestinationPath "disk-analyzer-windows-x86_64.zip" -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: disk-analyzer-windows-x86_64
          path: |
            dist/disk-analyzer.exe
            disk-analyzer-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/disk-analyzer.exe
            disk-analyzer-windows-x86_64.zip
